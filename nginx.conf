server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    location / {
        # Support Single Page Application (SPA) HTML5 History mode routing
        try_files $uri $uri/ /index.html;
    }

    # Proxy /uploads/ requests directly to AWS S3 bucket
    location /uploads/ {
        resolver 8.8.8.8 ipv6=off valid=300s;
        proxy_pass https://prod-dairy-images-09876.s3.us-east-2.amazonaws.com/uploads/;
        proxy_set_header Host prod-dairy-images-09876.s3.us-east-2.amazonaws.com;
        proxy_ssl_server_name on;
    }

    # Static assets cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

